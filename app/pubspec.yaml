name: meal_finder
description: "Finding products in supermarket shelves for PVI"

# Prevent accidental publishing to pub.dev.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  sqlite3: ^3.1.0
  sqlite_vector: ^0.9.93
  shared_preferences: ^2.2.2
  intl: ^0.20.2

  ultralytics_yolo: ^0.2.0
  tflite_flutter: ^0.12.1

  image_picker: ^1.1.2
  camera: ^0.11.0+2
  image: ^4.1.3

  permission_handler: ^12.0.1
  path_provider: ^2.1.1
  path: ^1.8.3
  flutter_tts: ^4.2.3
  http: ^1.6.0
  archive: ^4.0.7
  

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Enable generation of localized Strings from arb files.
  generate: true

  assets:
    # Add assets from the images directory to the application.
    - assets/

    - assets/images/
    - assets/images/iou.png
    - assets/images/logo.png

    - assets/db/
    - assets/db/class_embeddings.sqlite


    - assets/ml/models/
    - assets/ml/models/yolo11s_sku110k_best_float16.tflite
    - assets/ml/models/yolo11s_sku110k_best_float16.csv

    - assets/ml/models/dinov3_vits16_pretrain_lvd1689m-08c60483_float32.tflite
